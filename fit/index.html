<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>pg / fit</title>
<meta name="theme-color" content="#f2f1ec" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="fit" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23f2f1ec%22/><text x=%2250%22 y=%2266%22 font-size=%2252%22 fill=%22%231a1d1b%22 text-anchor=%22middle%22 font-family=%22monospace%22>fit</text></svg>" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2f1ec;
  --card:#faf9f6;
  --ink:#1a1d1b;
  --dim:#8b8e88;
  --line:#dddcd4;
  --green:#256c4a;
  --green-soft:#e4ece5;
  --red:#b04a3a;
  --font:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--paper)}
body{
  font-family:var(--font);color:var(--ink);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100dvh;
}
button,input,select,textarea{font-family:var(--font);color:var(--ink)}
button{cursor:pointer}

.app{
  max-width:430px;margin:0 auto;min-height:100dvh;
  display:flex;flex-direction:column;
  padding:0 1.1rem calc(4.6rem + env(safe-area-inset-bottom));
}

/* ---------- login ---------- */
.gate{
  position:fixed;inset:0;background:var(--paper);z-index:90;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1.4rem;padding:2rem 1.4rem;
}
.gate.hide{display:none}
.gate .brand{font-size:0.95rem;font-weight:600}
.gate .brand span{color:var(--dim);font-weight:400}
.gate form{display:flex;flex-direction:column;gap:0.7rem;width:100%;max-width:300px}
.gate .err{font-size:0.72rem;color:var(--red);min-height:1em;text-align:center}

/* ---------- header ---------- */
.head{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:1.2rem 0 0.9rem;border-bottom:1px solid var(--line);gap:0.7rem;
}
.head .brand{font-size:0.9rem;font-weight:600;letter-spacing:0.02em}
.head .brand span{color:var(--dim);font-weight:400}
.head .right{display:flex;align-items:baseline;gap:0.6rem;font-size:0.7rem;color:var(--dim)}
.sync{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;transform:translateY(-1px)}
.sync.pending{background:#c9962e}
.sync.off{background:var(--dim)}

/* ---------- views ---------- */
.view{display:none;padding-top:1.1rem;animation:fade 300ms ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.label{font-size:0.66rem;color:var(--dim);letter-spacing:0.07em;margin-bottom:0.5rem}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:0.95rem 1rem;margin-bottom:0.8rem;
}

.gauge{margin-bottom:0.9rem}
.gauge:last-child{margin-bottom:0}
.gauge .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:0.25rem}
.gauge .name{font-size:0.72rem;color:var(--dim)}
.gauge .val{font-size:0.86rem;font-weight:600;font-variant-numeric:tabular-nums}
.gauge .val small{color:var(--dim);font-weight:400;font-size:0.7rem}
.blocks{font-size:0.8rem;letter-spacing:0.12em;color:var(--green);white-space:nowrap;overflow:hidden}
.blocks .off{color:var(--line)}
.blocks.over{color:var(--red)}

.big{font-size:1.9rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}

.today-plan{display:flex;flex-direction:column;gap:0.45rem}
.plan-item{display:flex;gap:0.6rem;font-size:0.78rem;align-items:baseline}
.plan-item .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transform:translateY(-1px)}
.plan-item .t{color:var(--dim);font-size:0.68rem;margin-left:auto;flex-shrink:0}
.dot.train{background:var(--green)}
.dot.shoot{background:var(--ink)}
.dot.other{background:var(--dim)}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;margin-top:0.2rem}
.qbtn{
  background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:0.75rem;font-size:0.76rem;text-align:left;transition:border-color 200ms ease;
}
.qbtn:hover{border-color:var(--ink)}
.qbtn b{display:block;font-weight:600;margin-bottom:0.15rem}
.qbtn span{color:var(--dim);font-size:0.66rem}

.btn{
  background:var(--ink);color:var(--paper);border:1px solid var(--ink);
  font-size:0.78rem;font-weight:500;padding:0.65rem 1rem;border-radius:6px;
  transition:opacity 200ms ease;width:100%;
}
.btn:hover{opacity:0.85}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:none;border:1px solid var(--line);color:var(--red)}

.input,select.input{
  background:var(--card);border:1px solid var(--line);border-radius:6px;
  font-size:0.8rem;padding:0.6rem 0.7rem;width:100%;transition:border-color 200ms ease;
}
.input:focus{outline:none;border-color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem}
.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:0.6rem}
.stack{display:flex;flex-direction:column;gap:0.6rem}

/* ---------- train ---------- */
.tmpl{display:flex;flex-direction:column;gap:0.6rem}
.tmpl-btn{
  background:var(--card);border:1px solid var(--line);border-radius:6px;
  padding:0.85rem 1rem;text-align:left;transition:border-color 200ms ease;
  display:flex;justify-content:space-between;align-items:center;font-size:0.8rem;
}
.tmpl-btn:hover{border-color:var(--green)}
.tmpl-btn span{color:var(--dim);font-size:0.68rem}

.wo-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.9rem}
.wo-head h2{font-size:0.9rem;font-weight:600}
.wo-timer{font-size:0.72rem;color:var(--dim);font-variant-numeric:tabular-nums}

.ex{margin-bottom:1rem}
.ex-name{font-size:0.78rem;font-weight:600;margin-bottom:0.45rem;display:flex;justify-content:space-between;align-items:baseline}
.ex-name .del-ex{background:none;border:none;color:var(--dim);font-size:0.8rem}
.ex-name .del-ex:hover{color:var(--red)}
.sets{display:flex;flex-direction:column;gap:0.35rem}
.set{display:grid;grid-template-columns:1.6rem 1fr 1fr 2.2rem;gap:0.45rem;align-items:center}
.set .n{font-size:0.68rem;color:var(--dim);text-align:center}
.set input{
  background:var(--card);border:1px solid var(--line);border-radius:5px;
  font-size:0.78rem;padding:0.42rem 0.5rem;width:100%;text-align:center;
  font-variant-numeric:tabular-nums;
}
.set input:focus{outline:none;border-color:var(--ink)}
.set .done{
  background:none;border:1px solid var(--line);border-radius:5px;height:100%;
  font-size:0.7rem;color:var(--dim);transition:all 150ms ease;
}
.set .done.on{background:var(--green);border-color:var(--green);color:#fff}
.add-set{background:none;border:1px dashed var(--line);border-radius:5px;font-size:0.68rem;color:var(--dim);padding:0.4rem;margin-top:0.35rem;width:100%}
.add-set:hover{color:var(--ink);border-color:var(--ink)}

.rest{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(4.9rem + env(safe-area-inset-bottom));
  background:var(--ink);color:var(--paper);border-radius:20px;
  padding:0.5rem 1rem;font-size:0.78rem;font-variant-numeric:tabular-nums;
  display:none;align-items:center;gap:0.7rem;z-index:30;
}
.rest.show{display:flex}
.rest button{background:none;border:none;color:var(--paper);font-size:0.7rem;opacity:0.7}
.rest button:hover{opacity:1}

.hist-item{display:flex;justify-content:space-between;font-size:0.76rem;padding:0.55rem 0;border-bottom:1px solid var(--line)}
.hist-item:last-child{border-bottom:none}
.hist-item .d{color:var(--dim);font-size:0.68rem}

/* ---------- food ---------- */
.food-totals{display:flex;gap:1.6rem;margin-bottom:0.2rem}
.food-totals .ft .big{font-size:1.5rem}
.chips{display:flex;flex-wrap:wrap;gap:0.45rem;margin-bottom:0.9rem}
.chip{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  font-size:0.7rem;padding:0.4rem 0.8rem;transition:border-color 150ms ease;
}
.chip:hover{border-color:var(--green)}
.food-list{display:flex;flex-direction:column}
.food-item{display:flex;justify-content:space-between;gap:0.7rem;font-size:0.76rem;padding:0.5rem 0;border-bottom:1px solid var(--line);align-items:baseline}
.food-item:last-child{border-bottom:none}
.food-item .m{color:var(--dim);font-size:0.68rem;white-space:nowrap}
.food-item .x{background:none;border:none;color:var(--dim);font-size:0.85rem;padding:0 0.2rem}
.food-item .x:hover{color:var(--red)}

/* ---------- plan ---------- */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.7rem}
.cal-head .m{font-size:0.82rem;font-weight:600}
.cal-head button{background:none;border:1px solid var(--line);border-radius:5px;width:1.9rem;height:1.9rem;font-size:0.8rem;color:var(--dim)}
.cal-head button:hover{color:var(--ink);border-color:var(--ink)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow{font-size:0.58rem;color:var(--dim);text-align:center;padding:0.3rem 0}
.cal-cell{
  aspect-ratio:1;border:1px solid transparent;border-radius:5px;background:var(--card);
  font-size:0.68rem;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;position:relative;font-variant-numeric:tabular-nums;
}
.cal-cell.pad{background:none}
.cal-cell:not(.pad):hover{border-color:var(--dim)}
.cal-cell.today{border-color:var(--green);font-weight:600}
.cal-cell.sel{background:var(--ink);color:var(--paper)}
.cal-dots{display:flex;gap:2px;height:4px}
.cal-dots i{width:4px;height:4px;border-radius:50%;display:block}
.cal-dots i.train{background:var(--green)}
.cal-dots i.shoot{background:var(--ink)}
.cal-cell.sel .cal-dots i.shoot{background:var(--paper)}
.cal-dots i.other{background:var(--dim)}

.day-events{margin-top:1rem}
.ev{display:flex;gap:0.6rem;align-items:baseline;font-size:0.78rem;padding:0.5rem 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:none}
.ev .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transform:translateY(-1px)}
.ev .x{background:none;border:none;color:var(--dim);margin-left:auto;font-size:0.85rem}
.ev .x:hover{color:var(--red)}
.empty{font-size:0.72rem;color:var(--dim);padding:0.6rem 0}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar .in{max-width:430px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{
  background:none;border:none;font-size:0.7rem;color:var(--dim);
  padding:0.95rem 0 0.85rem;letter-spacing:0.03em;transition:color 150ms ease;
}
.tab.active{color:var(--ink);font-weight:600}
.tab:hover{color:var(--ink)}

.section-gap{margin-top:1.4rem}
.hide{display:none !important}
.signout{background:none;border:none;color:var(--dim);font-size:0.68rem;padding:0}
.signout:hover{color:var(--ink)}
@media (prefers-reduced-motion: reduce){.view{animation:none}}
</style>
</head>
<body>

<!-- login gate -->
<div class="gate" id="gate">
  <div class="brand">pg <span>/ fit</span></div>
  <form id="loginForm">
    <input class="input" id="email" type="email" placeholder="email" autocomplete="email" required />
    <input class="input" id="pass" type="password" placeholder="password" autocomplete="current-password" required />
    <button class="btn" type="submit">sign in</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div class="app">
  <header class="head">
    <div class="brand">pg <span>/ fit</span></div>
    <div class="right">
      <span class="sync" id="sync" title="synced"></span>
      <span id="headDate"></span>
      <button class="signout" onclick="signOut()">out</button>
    </div>
  </header>

  <!-- TODAY -->
  <section class="view active" id="view-today">
    <div class="card">
      <div class="label">today</div>
      <div class="gauge">
        <div class="top"><span class="name">protein</span><span class="val" id="gProteinVal"></span></div>
        <div class="blocks" id="gProtein"></div>
      </div>
      <div class="gauge">
        <div class="top"><span class="name">calories</span><span class="val" id="gKcalVal"></span></div>
        <div class="blocks" id="gKcal"></div>
      </div>
      <div class="gauge">
        <div class="top"><span class="name">steps</span><span class="val" id="gStepsVal"></span></div>
        <div class="blocks" id="gSteps"></div>
      </div>
    </div>

    <div class="card">
      <div class="label">planned</div>
      <div class="today-plan" id="todayPlan"></div>
    </div>

    <div class="quick">
      <button class="qbtn" onclick="go('train')"><b>log workout</b><span id="qLastWo">start a session</span></button>
      <button class="qbtn" onclick="go('food')"><b>log food</b><span>quick-add or custom</span></button>
      <button class="qbtn" onclick="promptSteps()"><b>steps</b><span>manual for now — shortcut later</span></button>
      <button class="qbtn" onclick="go('plan')"><b>plan</b><span>calendar + events</span></button>
    </div>
  </section>

  <!-- TRAIN -->
  <section class="view" id="view-train">
    <div id="trainHome">
      <div class="label">start from template</div>
      <div class="tmpl" id="tmplList"></div>
      <button class="btn ghost" style="margin-top:0.7rem" onclick="startWorkout('empty')">empty workout</button>
      <div class="section-gap">
        <div class="label">history</div>
        <div class="card" id="histList"></div>
      </div>
    </div>

    <div id="trainActive" class="hide">
      <div class="wo-head">
        <h2 id="woTitle">workout</h2>
        <span class="wo-timer" id="woTimer">00:00</span>
      </div>
      <div id="exList"></div>
      <div class="stack">
        <div class="row2">
          <input class="input" id="newExName" placeholder="add exercise" />
          <button class="btn ghost" onclick="addExercise()">add</button>
        </div>
        <button class="btn green" onclick="finishWorkout()">finish workout</button>
        <button class="btn danger" onclick="discardWorkout()">discard</button>
      </div>
    </div>
  </section>

  <!-- FOOD -->
  <section class="view" id="view-food">
    <div class="card">
      <div class="food-totals">
        <div class="ft"><div class="label">protein</div><div class="big" id="fProtein">0g</div></div>
        <div class="ft"><div class="label">kcal</div><div class="big" id="fKcal">0</div></div>
      </div>
    </div>

    <div class="label">quick add</div>
    <div class="chips" id="chipList"></div>

    <div class="label">custom</div>
    <div class="stack" style="margin-bottom:1.2rem">
      <div class="row3">
        <input class="input" id="foodName" placeholder="food" />
        <input class="input" id="foodP" placeholder="g prot" type="number" inputmode="numeric" />
        <input class="input" id="foodK" placeholder="kcal" type="number" inputmode="numeric" />
      </div>
      <button class="btn" onclick="addCustomFood()">add food</button>
    </div>

    <div class="label">eaten today</div>
    <div class="card"><div class="food-list" id="foodList"></div></div>
  </section>

  <!-- PLAN -->
  <section class="view" id="view-plan">
    <div class="cal-head">
      <button onclick="calMove(-1)">‹</button>
      <span class="m" id="calMonth"></span>
      <button onclick="calMove(1)">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>

    <div class="day-events">
      <div class="label" id="selDayLabel">events</div>
      <div class="card"><div id="evList"></div></div>
      <div class="stack">
        <div class="row3">
          <input class="input" id="evTitle" placeholder="event" />
          <select class="input" id="evType">
            <option value="train">train</option>
            <option value="shoot">shoot</option>
            <option value="other">other</option>
          </select>
          <input class="input" id="evTime" type="time" />
        </div>
        <button class="btn" onclick="addEvent()">add to day</button>
      </div>
    </div>
  </section>
</div>

<div class="rest" id="rest">
  <span id="restT">2:00</span>
  <button onclick="restAdd(30)">+30s</button>
  <button onclick="restStop()">skip</button>
</div>

<nav class="tabbar"><div class="in">
  <button class="tab active" data-v="today" onclick="go('today')">today</button>
  <button class="tab" data-v="train" onclick="go('train')">train</button>
  <button class="tab" data-v="food" onclick="go('food')">food</button>
  <button class="tab" data-v="plan" onclick="go('plan')">plan</button>
</div></nav>

<script type="module">
import { supabase } from './supabase.js';

/* ============ config ============ */
const TARGETS = { protein: 105, kcal: 2400, steps: 10000 };
const TEMPLATES = {
  push: ['bench press','incline db press','shoulder press','lateral raise','tricep pushdown'],
  pull: ['deadlift','pull ups','barbell row','face pull','bicep curl'],
  legs: ['squat','romanian deadlift','leg press','leg curl','calf raise']
};
const todayKey = () => {
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
const uid = () => crypto.randomUUID();

/* ============ local cache + offline queue ============ */
const cacheGet = (k, fb) => { try{ return JSON.parse(localStorage.getItem('pgfit:'+k)) ?? fb }catch{ return fb } };
const cacheSet = (k, v) => localStorage.setItem('pgfit:'+k, JSON.stringify(v));

let state = cacheGet('state', { days:{}, quick:[], workouts:[], events:{} });
let queue = cacheGet('queue', []);
function persist(){ cacheSet('state', state); cacheSet('queue', queue); }

function syncDot(mode){
  const el = document.getElementById('sync');
  el.className = 'sync' + (mode==='pending' ? ' pending' : mode==='off' ? ' off' : '');
  el.title = mode==='pending' ? 'changes waiting to sync' : mode==='off' ? 'offline' : 'synced';
}

async function push(op){
  queue.push(op); persist(); syncDot('pending');
  await flush();
}
let flushing = false;
async function flush(){
  if (flushing || !navigator.onLine) { if(!navigator.onLine) syncDot('off'); return; }
  flushing = true;
  try{
    while(queue.length){
      const op = queue[0];
      let q;
      if (op.kind==='upsert') q = supabase.from(op.table).upsert(op.row, op.opts||{});
      else if (op.kind==='insert') q = supabase.from(op.table).insert(op.row);
      else if (op.kind==='delete') q = supabase.from(op.table).delete().eq('id', op.id);
      const { error } = await q;
      if (error) throw error;
      queue.shift(); persist();
    }
    syncDot('ok');
  }catch(e){
    console.warn('sync paused:', e.message);
    syncDot('pending');
  }finally{
    flushing = false;
  }
}
window.addEventListener('online', flush);
window.addEventListener('offline', ()=>syncDot('off'));

/* ============ auth ============ */
const gate = document.getElementById('gate');
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const { error } = await supabase.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('pass').value
  });
  document.getElementById('loginErr').textContent = error ? error.message.toLowerCase() : '';
  if (!error){ gate.classList.add('hide'); await pull(); }
});
window.signOut = async ()=>{ await supabase.auth.signOut(); location.reload(); };

/* ============ server pull ============ */
async function pull(){
  try{
    const since = new Date(Date.now() - 45*86400000).toISOString().slice(0,10);
    const [days, foods, quick, wos, evs] = await Promise.all([
      supabase.from('fit_days').select('date,steps').gte('date', since),
      supabase.from('fit_food_log').select('id,date,name,protein,kcal').gte('date', since).order('created_at'),
      supabase.from('fit_quick_foods').select('id,name,protein,kcal'),
      supabase.from('fit_workouts').select('id,date,title,mins,sets').order('date',{ascending:false}).limit(30),
      supabase.from('fit_events').select('id,date,title,type,time')
    ]);
    if (days.error||foods.error||quick.error||wos.error||evs.error) throw (days.error||foods.error||quick.error||wos.error||evs.error);

    const s = { days:{}, quick:[], workouts:[], events:{} };
    for (const d of days.data) s.days[d.date] = { steps: d.steps, foods: [] };
    for (const f of foods.data){
      if (!s.days[f.date]) s.days[f.date] = { steps:0, foods:[] };
      s.days[f.date].foods.push({ id:f.id, name:f.name, p:f.protein, k:f.kcal });
    }
    s.quick = quick.data.map(q=>({ id:q.id, name:q.name, p:q.protein, k:q.kcal }));
    s.workouts = wos.data.reverse();
    for (const e of evs.data){
      if (!s.events[e.date]) s.events[e.date] = [];
      s.events[e.date].push({ id:e.id, title:e.title, type:e.type, time:e.time||'' });
    }
    state = s; persist(); renderAll(); syncDot('ok');
    flush();
  }catch(e){
    console.warn('pull failed, using cache:', e.message);
    syncDot(navigator.onLine ? 'pending' : 'off');
  }
}

/* ============ helpers ============ */
function day(){
  if(!state.days[todayKey()]) state.days[todayKey()] = { steps:0, foods:[] };
  return state.days[todayKey()];
}
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function blocks(cur, max, n=14){
  const filled = Math.min(n, Math.round((cur/max)*n));
  return '▮'.repeat(filled) + '<span class="off">' + '▯'.repeat(n-filled) + '</span>';
}

/* ============ nav ============ */
window.go = v => {
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.v===v));
  window.scrollTo({top:0});
};

/* ============ today ============ */
function renderToday(){
  const d = day();
  const p = d.foods.reduce((s,f)=>s+f.p,0);
  const k = d.foods.reduce((s,f)=>s+f.k,0);
  document.getElementById('gProteinVal').innerHTML = p+'<small> / '+TARGETS.protein+'g</small>';
  document.getElementById('gKcalVal').innerHTML = k+'<small> / '+TARGETS.kcal+'</small>';
  document.getElementById('gStepsVal').innerHTML = d.steps.toLocaleString()+'<small> / 10k</small>';
  document.getElementById('gProtein').innerHTML = blocks(p, TARGETS.protein);
  const kEl = document.getElementById('gKcal');
  kEl.innerHTML = blocks(k, TARGETS.kcal);
  kEl.classList.toggle('over', k > TARGETS.kcal);
  document.getElementById('gSteps').innerHTML = blocks(d.steps, TARGETS.steps);

  const evs = (state.events[todayKey()]||[]).slice().sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
  document.getElementById('todayPlan').innerHTML = evs.length ? evs.map(e=>
    `<div class="plan-item"><span class="dot ${e.type}"></span>${esc(e.title)}<span class="t">${e.time||''}</span></div>`
  ).join('') : '<div class="empty">nothing planned. add it in plan.</div>';

  const last = state.workouts[state.workouts.length-1];
  document.getElementById('qLastWo').textContent = last ? 'last: '+last.title+' · '+last.date : 'start a session';
}
window.promptSteps = ()=>{
  const v = prompt('steps today?');
  if(v===null) return;
  const n = parseInt(v.replace(/[^0-9]/g,''),10);
  if(isNaN(n)) return;
  day().steps = n; persist(); renderToday();
  push({ kind:'upsert', table:'fit_days', row:{ date: todayKey(), steps: n }, opts:{ onConflict:'date,user_id' } });
};

/* ============ train ============ */
let active=null, woTick=null, restTick=null, restLeft=0;

function renderTemplates(){
  document.getElementById('tmplList').innerHTML = Object.keys(TEMPLATES).map(t=>
    `<button class="tmpl-btn" onclick="startWorkout('${t}')">${t}<span>${TEMPLATES[t].length} exercises</span></button>`).join('');
}
window.startWorkout = t => {
  const exs = t==='empty' ? [] : TEMPLATES[t].map(n=>({name:n, sets:[{w:'',r:'',done:false}]}));
  active = { title: t==='empty'?'workout':t, start: Date.now(), exercises: exs };
  document.getElementById('trainHome').classList.add('hide');
  document.getElementById('trainActive').classList.remove('hide');
  document.getElementById('woTitle').textContent = active.title;
  woTick = setInterval(()=>{
    const s = Math.floor((Date.now()-active.start)/1000);
    document.getElementById('woTimer').textContent =
      String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  },1000);
  renderExercises(); go('train');
};
function renderExercises(){
  document.getElementById('exList').innerHTML = active.exercises.map((ex,ei)=>`
    <div class="ex">
      <div class="ex-name">${esc(ex.name)}<button class="del-ex" onclick="delEx(${ei})">×</button></div>
      <div class="sets">
        <div class="set"><span class="n">#</span><span class="n">kg</span><span class="n">reps</span><span class="n">✓</span></div>
        ${ex.sets.map((s,si)=>`
          <div class="set">
            <span class="n">${si+1}</span>
            <input type="number" inputmode="decimal" value="${s.w}" placeholder="0" onchange="setVal(${ei},${si},'w',this.value)" />
            <input type="number" inputmode="numeric" value="${s.r}" placeholder="0" onchange="setVal(${ei},${si},'r',this.value)" />
            <button class="done ${s.done?'on':''}" onclick="toggleSet(${ei},${si})">${s.done?'✓':''}</button>
          </div>`).join('')}
        <button class="add-set" onclick="addSet(${ei})">+ set</button>
      </div>
    </div>`).join('');
}
window.setVal = (ei,si,k,v)=>{ active.exercises[ei].sets[si][k]=v; };
window.toggleSet = (ei,si)=>{
  const s = active.exercises[ei].sets[si];
  s.done = !s.done; renderExercises();
  if(s.done) restStart(120);
};
window.addSet = ei => { active.exercises[ei].sets.push({w:'',r:'',done:false}); renderExercises(); };
window.delEx = ei => { active.exercises.splice(ei,1); renderExercises(); };
window.addExercise = ()=>{
  const el = document.getElementById('newExName');
  if(!el.value.trim()) return;
  active.exercises.push({name: el.value.trim().toLowerCase(), sets:[{w:'',r:'',done:false}]});
  el.value=''; renderExercises();
};
window.finishWorkout = ()=>{
  const total = active.exercises.reduce((s,e)=>s+e.sets.filter(x=>x.done).length,0);
  const w = {
    id: uid(), date: todayKey(), title: active.title,
    mins: Math.round((Date.now()-active.start)/60000), sets: total
  };
  state.workouts.push(w); persist();
  push({ kind:'insert', table:'fit_workouts', row:{ ...w, data: active.exercises } });
  endWorkout();
};
window.discardWorkout = ()=>{ if(confirm('discard this session?')) endWorkout(); };
function endWorkout(){
  clearInterval(woTick); restStop(); active=null;
  document.getElementById('trainActive').classList.add('hide');
  document.getElementById('trainHome').classList.remove('hide');
  renderHistory(); renderToday();
}
function renderHistory(){
  const el = document.getElementById('histList');
  el.innerHTML = state.workouts.length ? state.workouts.slice(-8).reverse().map(w=>
    `<div class="hist-item"><span>${esc(w.title)} · ${w.sets} sets</span><span class="d">${w.date} · ${w.mins}m</span></div>`
  ).join('') : '<div class="empty">no sessions yet.</div>';
}

/* rest timer */
function restStart(sec){
  restLeft = sec; clearInterval(restTick);
  document.getElementById('rest').classList.add('show');
  restRender();
  restTick = setInterval(()=>{
    restLeft--;
    if(restLeft<=0){ restStop(); if(navigator.vibrate) navigator.vibrate(200); return; }
    restRender();
  },1000);
}
function restRender(){
  document.getElementById('restT').textContent = Math.floor(restLeft/60)+':'+String(restLeft%60).padStart(2,'0');
}
window.restAdd = s => { restLeft+=s; restRender(); };
window.restStop = ()=>{ clearInterval(restTick); document.getElementById('rest').classList.remove('show'); };
const restStop = window.restStop;

/* ============ food ============ */
function renderFood(){
  const d = day();
  const p = d.foods.reduce((s,f)=>s+f.p,0);
  const k = d.foods.reduce((s,f)=>s+f.k,0);
  document.getElementById('fProtein').textContent = p+'g';
  document.getElementById('fKcal').textContent = k;
  document.getElementById('chipList').innerHTML = state.quick.length ? state.quick.map((f,i)=>
    `<button class="chip" onclick="addQuick(${i})">${esc(f.name)}</button>`).join('')
    : '<div class="empty">add a custom food and it becomes a chip.</div>';
  document.getElementById('foodList').innerHTML = d.foods.length ? d.foods.map((f,i)=>
    `<div class="food-item"><span>${esc(f.name)}</span><span class="m">${f.p}g · ${f.k} kcal</span><button class="x" onclick="delFood(${i})">×</button></div>`
  ).join('') : '<div class="empty">nothing logged yet.</div>';
}
function logFood(name, p, k){
  const f = { id: uid(), name, p, k };
  day().foods.push(f); persist(); renderToday(); renderFood();
  push({ kind:'insert', table:'fit_food_log', row:{ id:f.id, date: todayKey(), name, protein:p, kcal:k } });
}
window.addQuick = i => { const f = state.quick[i]; logFood(f.name, f.p, f.k); };
window.addCustomFood = ()=>{
  const n = document.getElementById('foodName').value.trim().toLowerCase();
  const p = parseInt(document.getElementById('foodP').value,10)||0;
  const k = parseInt(document.getElementById('foodK').value,10)||0;
  if(!n) return;
  logFood(n, p, k);
  if(!state.quick.some(q=>q.name===n)){
    const qf = { id: uid(), name:n, p, k };
    state.quick.unshift(qf); state.quick = state.quick.slice(0,12); persist();
    push({ kind:'upsert', table:'fit_quick_foods', row:{ name:n, protein:p, kcal:k }, opts:{ onConflict:'user_id,name' } });
  }
  ['foodName','foodP','foodK'].forEach(id=>document.getElementById(id).value='');
  renderFood();
};
window.delFood = i => {
  const f = day().foods.splice(i,1)[0];
  persist(); renderToday(); renderFood();
  push({ kind:'delete', table:'fit_food_log', id: f.id });
};

/* ============ plan ============ */
let calCur = new Date(); calCur.setDate(1);
let selDate = todayKey();

window.calMove = n => { calCur.setMonth(calCur.getMonth()+n); renderCal(); };
function renderCal(){
  const y = calCur.getFullYear(), m = calCur.getMonth();
  document.getElementById('calMonth').textContent =
    calCur.toLocaleString('en-IE',{month:'long'}).toLowerCase()+' '+y;
  const first = (new Date(y,m,1).getDay()+6)%7;
  const dim = new Date(y,m+1,0).getDate();
  let html = ['mo','tu','we','th','fr','sa','su'].map(d=>`<span class="cal-dow">${d}</span>`).join('');
  for(let i=0;i<first;i++) html += '<span class="cal-cell pad"></span>';
  for(let d=1;d<=dim;d++){
    const key = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const types = [...new Set((state.events[key]||[]).map(e=>e.type))];
    html += `<button class="cal-cell ${key===todayKey()?'today':''} ${key===selDate?'sel':''}" onclick="selDay('${key}')">
      ${d}<span class="cal-dots">${types.map(t=>`<i class="${t}"></i>`).join('')}</span></button>`;
  }
  document.getElementById('calGrid').innerHTML = html;
  renderEvents();
}
window.selDay = k => { selDate = k; renderCal(); };
function renderEvents(){
  const evs = (state.events[selDate]||[]).slice().sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
  document.getElementById('selDayLabel').textContent =
    new Date(selDate+'T00:00').toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'}).toLowerCase();
  document.getElementById('evList').innerHTML = evs.length ? evs.map(e=>
    `<div class="ev"><span class="dot ${e.type}"></span>${esc(e.title)}<span style="color:var(--dim);font-size:0.68rem">${e.time||''}</span><button class="x" onclick="delEvent('${e.id}')">×</button></div>`
  ).join('') : '<div class="empty">no events this day.</div>';
}
window.addEvent = ()=>{
  const t = document.getElementById('evTitle').value.trim().toLowerCase();
  if(!t) return;
  const ev = { id: uid(), title:t, type:document.getElementById('evType').value, time:document.getElementById('evTime').value };
  if(!state.events[selDate]) state.events[selDate]=[];
  state.events[selDate].push(ev); persist();
  push({ kind:'insert', table:'fit_events', row:{ id:ev.id, date:selDate, title:ev.title, type:ev.type, time:ev.time||null } });
  document.getElementById('evTitle').value='';
  renderCal(); renderToday();
};
window.delEvent = id => {
  state.events[selDate] = (state.events[selDate]||[]).filter(e=>e.id!==id);
  if(!state.events[selDate].length) delete state.events[selDate];
  persist(); renderCal(); renderToday();
  push({ kind:'delete', table:'fit_events', id });
};

/* ============ boot ============ */
function renderAll(){ renderToday(); renderTemplates(); renderHistory(); renderFood(); renderCal(); }
document.getElementById('headDate').textContent =
  new Date().toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'}).toLowerCase();
renderAll();

const { data:{ session } } = await supabase.auth.getSession();
if (session){ gate.classList.add('hide'); pull(); }
else syncDot('off');

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
